name: Package

# Builds the engine's release packages from a clean checkout -- the same steps
# tools/release.sh runs on a dev machine (step 5), minus versioning, tagging
# and publishing. Each package is unpacked and run by tools/smoke_package.py,
# then attached to the run as an artifact.
#
# A clean checkout is the point: a dev-machine package ships whatever sits in
# that machine's gitignored assets/ (#527) and links its distro's codec
# library versions (#525). These packages contain only what git tracks.
#
# The Windows package is cross-compiled with MinGW-w64 and run under Wine, as
# tools/release.sh does it (#538). Its libraries in __lib_windows/ come from
# tools/build_deps_windows.sh: CPython is python.org's embeddable package, pinned by
# sha256; SFML, libtcod and libghostty-vt (Zig cross-build) are built from the submodules.
#
# Releases package here. .gitea/workflows/package.yaml is this file with the Forgejo
# runner's label, manual-only (workflow_dispatch) there; keep the steps in step when one
# changes. Steps run as root in the Forgejo runner's container (no sudo) and as a sudoer
# on GitHub's VMs, hence $SUDO.

on:
  push:
    branches: ['ci/**']
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

env:
  ALSOFT_DRIVERS: "null"
  APT_PACKAGES: >-
    build-essential cmake git rsync xvfb pandoc
    zlib1g-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev
    libfreetype-dev libudev-dev libvorbis-dev libflac-dev libogg-dev
    libgl-dev libopenal-dev libzstd-dev uuid-dev curl xz-utils ca-certificates
    libssl-dev libffi-dev libsqlite3-dev libbz2-dev liblzma-dev
    libreadline-dev libncurses-dev libgdbm-dev
  # CPython 3.15's Platforms/emscripten/config.toml pins this version.
  EMSDK_VERSION: "4.0.19"
  # MinGW-w64 cross compiler (the posix thread model, as the toolchain file names) and
  # Wine, which runs the Windows package's smoke test.
  WINDOWS_APT_PACKAGES: >-
    g++-mingw-w64-x86-64-posix wine

jobs:
  linux:
    # Pinned: the package must run on the documented floor (Debian 13 / Ubuntu 24.04,
    # glibc 2.39). ubuntu-latest moved to 26.04, whose builds need GLIBC_2.43.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y $APT_PACKAGES

      # Keys are computed into variables first: with `shell: bash` (-e -o pipefail) a failing
      # input command fails the step, instead of hashing less and silently weakening the key.
      - name: Dependency cache key
        id: deps-key
        shell: bash
        run: |
          tree=$(git ls-tree HEAD modules/)
          files=$(cat tools/build_deps.sh tools/build_python.sh tools/build_libghostty.sh /etc/os-release)
          echo "key=$(printf '%s\n' "$tree" "$files" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache built dependencies
        uses: actions/cache@v4
        with:
          path: |
            __lib
            __lib_static
          key: deps-release-${{ steps.deps-key.outputs.key }}

      - name: Build dependencies
        run: make deps

      - name: Build (Release)
        run: make linux

      - name: Generate the docs the package bundles
        run: xvfb-run -a -s "-noreset" make docs

      - name: Package
        run: make package-linux

      - name: Smoke-test the package
        # The SFML build needs an X display to create a Grid, even with --headless.
        # smoke_package.py also runs the package in clean debian:13 and
        # ubuntu:24.04 containers (#525), which needs podman or docker on the runner.
        run: xvfb-run -a -s "-noreset" python3 tools/smoke_package.py --version "$(tools/version.sh)" dist/McRogueFace-*-Linux.tar.gz

      - name: Report what the package links against (#525)
        if: always()
        run: |
          set -x
          cat /etc/os-release | head -3
          tar -tzf dist/McRogueFace-*-Linux.tar.gz | grep -E '/lib/[^/]+$' || true
          readelf -d build/lib/libsfml-audio.so.* | grep NEEDED || true
          readelf -d build/lib/Python/lib.linux-x86_64-*/_ssl.*.so | grep NEEDED || true

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: McRogueFace-Linux
          path: dist/McRogueFace-*-Linux.tar.gz
          if-no-files-found: error

  web:
    # Pinned: the package must run on the documented floor (Debian 13 / Ubuntu 24.04,
    # glibc 2.39). ubuntu-latest moved to 26.04, whose builds need GLIBC_2.43.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y $APT_PACKAGES

      # Keys are computed into variables first: with `shell: bash` (-e -o pipefail) a failing
      # input command fails the step, instead of hashing less and silently weakening the key.
      - name: Dependency cache keys
        id: deps-key
        shell: bash
        run: |
          tree=$(git ls-tree HEAD modules/)
          files=$(cat tools/build_deps.sh tools/build_python.sh tools/build_libghostty.sh /etc/os-release)
          echo "key=$(printf '%s\n' "$tree" "$files" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          wasm_tree=$(git ls-tree HEAD modules/cpython modules/libtcod-headless modules/ghostty)
          wasm_files=$(cat tools/build_deps_wasm.sh tools/build_python_wasm.sh tools/build_libghostty.sh /etc/os-release)
          echo "wasm=$(printf '%s\n' "$wasm_tree" "$wasm_files" | sha256sum | cut -c1-16)-$EMSDK_VERSION" >> "$GITHUB_OUTPUT"

      # Restore and save are separate steps so that a build which gets this far
      # is cached even when a later step fails.
      - name: Restore built dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            __lib
            __lib_static
          key: deps-release-${{ steps.deps-key.outputs.key }}

      - name: Build dependencies
        run: make deps

      - name: Save built dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            __lib
            __lib_static
          key: deps-release-${{ steps.deps-key.outputs.key }}

      # package-web runs the Linux build's interpreter to assemble the zip.
      - name: Build the Linux engine
        run: make linux

      - name: Install emsdk ${{ env.EMSDK_VERSION }}
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Restore the Emscripten dependency builds
        id: wasm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            modules/cpython/cross-build
            modules/libtcod-headless/build-emscripten
            __lib_wasm
            build-deps/dl
            build-deps/zig-global-cache
            ~/.cache/emscripten
          key: wasm-deps-${{ steps.deps-key.outputs.wasm }}

      - name: Build the Emscripten dependencies (CPython, libtcod, stb, libghostty-vt)
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          tools/build_deps_wasm.sh

      - name: Save the Emscripten dependency builds
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            modules/cpython/cross-build
            modules/libtcod-headless/build-emscripten
            __lib_wasm
            build-deps/dl
            build-deps/zig-global-cache
            ~/.cache/emscripten
          key: wasm-deps-${{ steps.deps-key.outputs.wasm }}

      - name: Package
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          make package-web

      - name: Smoke-test the package (headless Chromium)
        run: |
          make test-wasm-setup
          $(command -v sudo || true) .venv-wasmtest/bin/python -m playwright install-deps chromium-headless-shell
          python3 tools/smoke_package.py --version "$(tools/version.sh)" dist/McRogueFace-*-WASM.zip

      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: McRogueFace-WASM
          path: dist/McRogueFace-*-WASM.zip
          if-no-files-found: warn

  windows:
    # Pinned: Wine and MinGW-w64 come from this release's repositories, and the
    # dependency cache is keyed on them.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Linux build is needed too: packaging runs on its interpreter, and `make windows`
      # copies the Linux CPython's stdlib into the package's lib/.
      - name: Install build dependencies
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y $APT_PACKAGES $WINDOWS_APT_PACKAGES

      # Keys are computed into variables first: with `shell: bash` (-e -o pipefail) a failing
      # input command fails the step, instead of hashing less and silently weakening the key.
      - name: Dependency cache keys
        id: deps-key
        shell: bash
        run: |
          tree=$(git ls-tree HEAD modules/)
          files=$(cat tools/build_deps.sh tools/build_python.sh tools/build_libghostty.sh /etc/os-release)
          echo "key=$(printf '%s\n' "$tree" "$files" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          win_tree=$(git ls-tree HEAD modules/SFML modules/libtcod-headless modules/cpython modules/ghostty)
          win_files=$(cat tools/build_deps_windows.sh tools/build_libghostty.sh tools/fetch_windows_python.sh cmake/toolchains/mingw-w64-x86_64.cmake /etc/os-release)
          # The compilers, headers and import libraries the dependencies are built with.
          win_tools=$(dpkg-query -W -f='${Package} ${Version}\n' g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix mingw-w64-x86-64-dev binutils-mingw-w64-x86-64)
          win_cmake=$(cmake --version)
          echo "windows=$(printf '%s\n' "$win_tree" "$win_files" "$win_tools" "$win_cmake" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore built dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            __lib
            __lib_static
          key: deps-release-${{ steps.deps-key.outputs.key }}

      - name: Build dependencies
        run: make deps

      - name: Save built dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            __lib
            __lib_static
          key: deps-release-${{ steps.deps-key.outputs.key }}

      - name: Restore the Windows dependency builds
        id: windows-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            __lib_windows
            build-deps/dl
            build-deps/zig-global-cache
          key: windows-deps-${{ steps.deps-key.outputs.windows }}

      - name: Build the Windows dependencies (CPython, SFML, libtcod, libghostty-vt)
        run: make deps-windows

      - name: Save the Windows dependency builds
        if: steps.windows-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            __lib_windows
            build-deps/dl
            build-deps/zig-global-cache
          key: windows-deps-${{ steps.deps-key.outputs.windows }}

      - name: Build the Linux engine
        run: make linux

      - name: Generate the docs the package bundles
        run: xvfb-run -a -s "-noreset" make docs

      - name: Package
        run: make package-windows

      - name: Smoke-test the package (Wine)
        # As tools/release.sh runs it: smoke_package.py starts the unpacked
        # mcrogueface.exe under wine and checks the version and the stdlib. Wine needs
        # an X display to create a window, even with --headless (release.sh has one).
        run: xvfb-run -a -s "-noreset" python3 tools/smoke_package.py --version "$(tools/version.sh)" dist/McRogueFace-*-Windows.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: McRogueFace-Windows
          path: dist/McRogueFace-*-Windows.zip
          if-no-files-found: error
