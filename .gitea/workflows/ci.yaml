name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

# Every job starts from a plain checkout: `make deps` shallow-inits the
# submodules it needs and builds SFML, libtcod and CPython into __lib/ and libghostty-vt
# (static, built by Zig) into __lib_static/ (cached on the submodule pins + build scripts).
# The Zig tarball and Zig's package caches (build-deps/) are cached apart, keyed on the ghostty
# pin and the build script, and only used (restored and saved) when the deps cache above misses:
# a warm run does no network fetches at all.
# Tests need an X display -- the SFML build opens one even with --headless -- so `run_tests.py -j N` starts N
# private Xvfb servers itself (no outer xvfb-run), with OpenAL's null backend
# standing in for an audio device. Jobs run on the `ffwf-k8s` runner: a fresh
# Ubuntu 24.04 container per job, 10 CPUs, no docker daemon, egress on 80/443 only.

env:
  ALSOFT_DRIVERS: "null"
  APT_PACKAGES: >-
    build-essential cmake git rsync xvfb
    zlib1g-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev
    libfreetype-dev libudev-dev libvorbis-dev libflac-dev libogg-dev
    libgl-dev libopenal-dev libzstd-dev uuid-dev
    curl xz-utils ca-certificates

jobs:
  # Source-only gates: no dependency build, runs in seconds.
  lint:
    runs-on: ffwf-k8s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Binding lint (#430) and its self-test
        run: make lint-bindings

      - name: Frozen docstring gate
        run: ./tools/check_frozen_docstrings.sh

  build-and-test:
    runs-on: ffwf-k8s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $APT_PACKAGES

      - name: Dependency cache key
        id: deps-key
        run: |
          echo "key=$(git ls-tree HEAD modules/ | cat - tools/build_deps.sh tools/build_python.sh tools/build_libghostty.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "zig=$(git ls-tree HEAD modules/ghostty | cat - tools/build_libghostty.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Restore, build, then save right after the build: a later test failure must not
      # discard the deps build (actions/cache saves only when the whole job succeeds).
      - name: Restore built dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            __lib
            __lib_static
          key: deps-release-${{ steps.deps-key.outputs.key }}

      # The Zig toolchain tarball and Zig's package caches (libghostty-vt's build
      # dependencies, fetched over https). Only used when the deps cache above misses; it is
      # saved only after a build that had no Zig cache, so it is never a tarball-only entry.
      - name: Restore Zig cache
        id: zig-cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            build-deps/dl
            build-deps/zig-global-cache
            build-deps/zig-pkg
          key: zig-${{ steps.deps-key.outputs.zig }}

      - name: Build dependencies
        run: make deps

      - name: Save Zig cache
        if: steps.deps-cache.outputs.cache-hit != 'true' && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build-deps/dl
            build-deps/zig-global-cache
            build-deps/zig-pkg
          key: zig-${{ steps.deps-key.outputs.zig }}

      - name: Save built dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            __lib
            __lib_static
          key: deps-release-${{ steps.deps-key.outputs.key }}

      - name: Build (Release)
        run: make linux

      # Generated, untracked inputs some tests read (docs/API_REFERENCE_DYNAMIC.md,
      # stubs/mcrfpy.pyi): `mcrf_project init` copies the stub into a new game's typings/.
      - name: Generate API docs and stubs
        run: |
          xvfb-run -a -s "-noreset" ./build/mcrogueface --headless --exec tools/generate_dynamic_docs.py
          xvfb-run -a -s "-noreset" ./build/mcrogueface --headless --exec tools/generate_stubs_v2.py

      # Up to 6 jobs share midlife's 12 cores, so a suite can get a third of its usual
      # CPU: double the per-test hang limits (the timeouts guard hangs, not speed).
      - name: Run tests (Release)
        run: cd tests && MCRF_TIMEOUT_MULTIPLIER=2 python3 run_tests.py -v -j 8

      - name: Test run left the tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the test suite modified tracked files:"
            git status --porcelain
            exit 1
          fi

  debug-test:
    runs-on: ffwf-k8s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $APT_PACKAGES

      - name: Dependency cache key
        id: deps-key
        run: |
          echo "key=$(git ls-tree HEAD modules/ | cat - tools/build_deps.sh tools/build_python.sh tools/build_libghostty.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "zig=$(git ls-tree HEAD modules/ghostty | cat - tools/build_libghostty.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore built dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            __lib
            __lib_static
            __lib_debug
          key: deps-debug-${{ steps.deps-key.outputs.key }}

      # The Zig toolchain tarball and Zig's package caches (libghostty-vt's build
      # dependencies, fetched over https). Only used when the deps cache above misses; it is
      # saved only after a build that had no Zig cache, so it is never a tarball-only entry.
      - name: Restore Zig cache
        id: zig-cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            build-deps/dl
            build-deps/zig-global-cache
            build-deps/zig-pkg
          key: zig-${{ steps.deps-key.outputs.zig }}

      - name: Build dependencies (+ pydebug CPython)
        run: |
          make deps
          ls __lib_debug/libpython3.*d.so.1.0 >/dev/null 2>&1 || make python-debug

      - name: Save Zig cache
        if: steps.deps-cache.outputs.cache-hit != 'true' && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build-deps/dl
            build-deps/zig-global-cache
            build-deps/zig-pkg
          key: zig-${{ steps.deps-key.outputs.zig }}

      - name: Save built dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            __lib
            __lib_static
            __lib_debug
          key: deps-debug-${{ steps.deps-key.outputs.key }}

      - name: Build (debug Python)
        run: make debug

      # stubs/mcrfpy.pyi is generated and untracked; `mcrf_project init` copies it into a new
      # game, and integration/mcrf_project_test.py checks that it did.
      - name: Generate API stubs
        run: LD_LIBRARY_PATH=$PWD/__lib_debug  xvfb-run -a -s "-noreset" ./build-debug/mcrogueface --headless --exec tools/generate_stubs_v2.py

      - name: Test (debug Python)
        run: make debug-test TEST_JOBS=8

  asan-test:
    runs-on: ffwf-k8s
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $APT_PACKAGES

      - name: Dependency cache key
        id: deps-key
        run: |
          echo "key=$(git ls-tree HEAD modules/ | cat - tools/build_deps.sh tools/build_python.sh tools/build_libghostty.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "zig=$(git ls-tree HEAD modules/ghostty | cat - tools/build_libghostty.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore built dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            __lib
            __lib_static
            __lib_debug
          key: deps-debug-${{ steps.deps-key.outputs.key }}

      # The Zig toolchain tarball and Zig's package caches (libghostty-vt's build
      # dependencies, fetched over https). Only used when the deps cache above misses; it is
      # saved only after a build that had no Zig cache, so it is never a tarball-only entry.
      - name: Restore Zig cache
        id: zig-cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            build-deps/dl
            build-deps/zig-global-cache
            build-deps/zig-pkg
          key: zig-${{ steps.deps-key.outputs.zig }}

      - name: Build dependencies (+ pydebug CPython)
        run: |
          make deps
          ls __lib_debug/libpython3.*d.so.1.0 >/dev/null 2>&1 || make python-debug

      - name: Save Zig cache
        if: steps.deps-cache.outputs.cache-hit != 'true' && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build-deps/dl
            build-deps/zig-global-cache
            build-deps/zig-pkg
          key: zig-${{ steps.deps-key.outputs.zig }}

      - name: Save built dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            __lib
            __lib_static
            __lib_debug
          key: deps-debug-${{ steps.deps-key.outputs.key }}

      - name: Build (ASan + UBSan)
        run: make asan

      # stubs/mcrfpy.pyi is generated and untracked; `mcrf_project init` copies it into a new
      # game, and integration/mcrf_project_test.py checks that it did.
      - name: Generate API stubs
        run: LD_LIBRARY_PATH=$PWD/__lib_debug PYTHONMALLOC=malloc ASAN_OPTIONS=detect_leaks=0 xvfb-run -a -s "-noreset" ./build-asan/mcrogueface --headless --exec tools/generate_stubs_v2.py

      - name: Test (ASan + UBSan)
        run: make asan-test TEST_JOBS=8

  valgrind-test:
    runs-on: ffwf-k8s
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $APT_PACKAGES valgrind

      - name: Dependency cache key
        id: deps-key
        run: |
          echo "key=$(git ls-tree HEAD modules/ | cat - tools/build_deps.sh tools/build_python.sh tools/build_libghostty.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "zig=$(git ls-tree HEAD modules/ghostty | cat - tools/build_libghostty.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore built dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            __lib
            __lib_static
            __lib_debug
          key: deps-debug-${{ steps.deps-key.outputs.key }}

      # The Zig toolchain tarball and Zig's package caches (libghostty-vt's build
      # dependencies, fetched over https). Only used when the deps cache above misses; it is
      # saved only after a build that had no Zig cache, so it is never a tarball-only entry.
      - name: Restore Zig cache
        id: zig-cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            build-deps/dl
            build-deps/zig-global-cache
            build-deps/zig-pkg
          key: zig-${{ steps.deps-key.outputs.zig }}

      - name: Build dependencies (+ pydebug CPython)
        run: |
          make deps
          ls __lib_debug/libpython3.*d.so.1.0 >/dev/null 2>&1 || make python-debug

      - name: Save Zig cache
        if: steps.deps-cache.outputs.cache-hit != 'true' && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build-deps/dl
            build-deps/zig-global-cache
            build-deps/zig-pkg
          key: zig-${{ steps.deps-key.outputs.zig }}

      - name: Save built dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            __lib
            __lib_static
            __lib_debug
          key: deps-debug-${{ steps.deps-key.outputs.key }}

      - name: Build (debug Python)
        run: make debug

      # stubs/mcrfpy.pyi is generated and untracked; `mcrf_project init` copies it into a new
      # game, and integration/mcrf_project_test.py checks that it did.
      - name: Generate API stubs
        run: LD_LIBRARY_PATH=$PWD/__lib_debug  xvfb-run -a -s "-noreset" ./build-debug/mcrogueface --headless --exec tools/generate_stubs_v2.py

      - name: Test (Valgrind memcheck)
        run: make valgrind-test TEST_JOBS=8
        timeout-minutes: 30
