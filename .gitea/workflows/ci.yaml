name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

# Every job starts from a plain checkout: `make deps` shallow-inits the
# submodules it needs and builds SFML, libtcod and CPython into __lib/
# (cached on the submodule pins + build scripts). Tests need an X display -- the
# SFML build opens one even with --headless -- so `run_tests.py -j N` starts N
# private Xvfb servers itself (no outer xvfb-run), with OpenAL's null backend
# standing in for an audio device. Jobs run on the `ffwf-k8s` runner: a fresh
# Ubuntu 24.04 container per job, 10 CPUs, no docker daemon, egress on 80/443 only.

env:
  ALSOFT_DRIVERS: "null"
  APT_PACKAGES: >-
    build-essential cmake git rsync xvfb
    zlib1g-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev
    libfreetype-dev libudev-dev libvorbis-dev libflac-dev libogg-dev
    libgl-dev libopenal-dev libzstd-dev uuid-dev

jobs:
  # Source-only gates: no dependency build, runs in seconds.
  lint:
    runs-on: ffwf-k8s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Binding lint (#430) and its self-test
        run: make lint-bindings

      - name: Frozen docstring gate
        run: ./tools/check_frozen_docstrings.sh

  build-and-test:
    runs-on: ffwf-k8s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $APT_PACKAGES

      - name: Dependency cache key
        id: deps-key
        run: echo "key=$(git ls-tree HEAD modules/ | cat - tools/build_deps.sh tools/build_python.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache built dependencies
        uses: actions/cache@v4
        with:
          path: __lib
          key: deps-release-${{ steps.deps-key.outputs.key }}

      - name: Build dependencies
        run: make deps

      - name: Build (Release)
        run: make linux

      - name: Run tests (Release)
        run: cd tests && python3 run_tests.py -v -j 8

      - name: Test run left the tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the test suite modified tracked files:"
            git status --porcelain
            exit 1
          fi

  debug-test:
    runs-on: ffwf-k8s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $APT_PACKAGES

      - name: Dependency cache key
        id: deps-key
        run: echo "key=$(git ls-tree HEAD modules/ | cat - tools/build_deps.sh tools/build_python.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache built dependencies
        uses: actions/cache@v4
        with:
          path: |
            __lib
            __lib_debug
          key: deps-debug-${{ steps.deps-key.outputs.key }}

      - name: Build dependencies (+ pydebug CPython)
        run: |
          make deps
          ls __lib_debug/libpython3.*d.so.1.0 >/dev/null 2>&1 || make python-debug

      - name: Build and test (debug Python)
        run: make debug-test TEST_JOBS=8

  asan-test:
    runs-on: ffwf-k8s
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $APT_PACKAGES

      - name: Dependency cache key
        id: deps-key
        run: echo "key=$(git ls-tree HEAD modules/ | cat - tools/build_deps.sh tools/build_python.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache built dependencies
        uses: actions/cache@v4
        with:
          path: |
            __lib
            __lib_debug
          key: deps-debug-${{ steps.deps-key.outputs.key }}

      - name: Build dependencies (+ pydebug CPython)
        run: |
          make deps
          ls __lib_debug/libpython3.*d.so.1.0 >/dev/null 2>&1 || make python-debug

      - name: Build and test (ASan + UBSan)
        run: make asan-test TEST_JOBS=8

  valgrind-test:
    runs-on: ffwf-k8s
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $APT_PACKAGES valgrind

      - name: Dependency cache key
        id: deps-key
        run: echo "key=$(git ls-tree HEAD modules/ | cat - tools/build_deps.sh tools/build_python.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache built dependencies
        uses: actions/cache@v4
        with:
          path: |
            __lib
            __lib_debug
          key: deps-debug-${{ steps.deps-key.outputs.key }}

      - name: Build dependencies (+ pydebug CPython)
        run: |
          make deps
          ls __lib_debug/libpython3.*d.so.1.0 >/dev/null 2>&1 || make python-debug

      - name: Build and test (Valgrind memcheck)
        run: make valgrind-test TEST_JOBS=8
        timeout-minutes: 30
